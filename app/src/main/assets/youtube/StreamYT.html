<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta name="referrer" content="no-referrer-when-downgrade">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>YouTube Stream Player</title>
  <style type="text/css">
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000000;
      overflow: hidden;
    }

    #player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #player-wrapper iframe, #ytplayer {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="player-wrapper">
    <div id="ytplayer"></div>
  </div>

  <script type="text/javascript">
    function getQueryParam(param) {
      var query = window.location.search.substring(1);
      var vars = query.split("&");
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split("=");
        if (pair[0] == param) {
          return decodeURIComponent(pair[1]);
        }
      }
      return false;
    }

    var videoIdFromUrl = getQueryParam("v");

    if (videoIdFromUrl) {
      var iframeUrl = "https://www.youtube-nocookie.com/embed/" + videoIdFromUrl + 
                      "?autoplay=1" +
                      "&controls=1" +
                      "&playsinline=1" +
                      "&rel=0" +
                      "&enablejsapi=1" +
                      "&origin=https://www.youtube-nocookie.com";

      var container = document.getElementById("player-wrapper");
      container.innerHTML = '<iframe id="ytplayer" type="text/html" src="' + iframeUrl + '" ' +
                            'frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    }

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      if (videoIdFromUrl && typeof YT !== 'undefined' && YT.Player) {
        player = new YT.Player('ytplayer', {
          events: {
            'onReady': function(event) {
            }
          }
        });
      }
    }
  </script>
</body>
</html>
