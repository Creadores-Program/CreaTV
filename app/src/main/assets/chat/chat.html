<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0e0e10;
            color: #efeff1;
            font-family: "Inter", "Roobert", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 13px;
        }

        #chat {
            padding: 8px 10px;
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: #0e0e10;
            -webkit-box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .message {
            margin-bottom: 6px;
            line-height: 1.4;
            word-wrap: break-word;
            word-break: break-word;
            -webkit-hyphens: auto;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        .user {
            font-weight: 700;
            color: #a970ff;
            margin-right: 4px;
        }

        .separator {
            color: #adadb8;
            margin-right: 4px;
        }

        .text {
            color: #efeff1;
        }

        .chat-emote {
            vertical-align: middle;
            height: 24px;
            margin: -2px 1px;
        }

        :-webkit-scrollbar {
            width: 4px;
        }
        :-webkit-scrollbar-track {
            background: #0e0e10;
        }
        :-webkit-scrollbar-thumb {
            background: #26262c;
            -webkit-border-radius: 2px;
            border-radius: 2px;
        }
        :-webkit-scrollbar-thumb:hover {
            background: #3a3a44;
        }
    </style>
</head>
<body>
    <div id="chat"></div>

    <script>
        var MAX_MESSAGES = 75;

        function getQueryParam(param) {
            var query = window.location.search.substring(1);
            var vars = query.split("&");
            for (var i = 0; i < vars.length; i++) {
                var pair = vars[i].split("=");
                if (pair[0] == param) { return decodeURIComponent(pair[1]); }
            }
            return null;
        }

        var channel = getQueryParam("channel");

        if (channel && channel.trim() !== "" && channel !== "null" && channel !== "undefined") {
            channel = channel.trim().toLowerCase();
            startChat(channel);
        }

        function startChat(targetChannel) {
            var chatContainer = document.getElementById("chat");
            var ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

            ws.onopen = function() {
                ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands\r\n");
                ws.send("PASS SCHMOOPIIE\r\n");
                ws.send("NICK justinfan" + Math.floor(10000 + Math.random() * 90000) + "\r\n");
                ws.send("JOIN #" + targetChannel + "\r\n");
            };

            ws.onmessage = function(event) {
                var messageData = event.data;

                if (messageData.indexOf("PING") === 0) {
                    ws.send("PONG :tmi.twitch.tv\r\n");
                    return;
                }

                if (messageData.indexOf("PRIVMSG") !== -1) {
                    var nickMatch = messageData.match(/display-name=([^;]+)/);
                    var userName = nickMatch && nickMatch[1] ? nickMatch[1] : "Anon";

                    var colorMatch = messageData.match(/color=#([0-9A-Fa-f]{6})/);
                    var userColor = colorMatch && colorMatch[1] ? "#" + colorMatch[1] : "#a970ff";
                    
                    var emotesMatch = messageData.match(/emotes=([^; ]*)/);
                    var rawEmotes = emotesMatch && emotesMatch[1] ? emotesMatch[1] : "";

                    var msgParts = messageData.split("PRIVMSG #" + targetChannel + " :");
                    if (msgParts.length > 1) {
                        var userMessage = msgParts[1];

                        var cleanMessage = userMessage.replace(/</g, "&lt;").replace(/>/g, "&gt;");

                        if (rawEmotes) {
                            cleanMessage = parseTwitchEmotes(cleanMessage, rawEmotes);
                        }

                        var distanceToBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight;
                        var nearEnd = distanceToBottom < 120;

                        var msgDiv = document.createElement("div");
                        msgDiv.className = "message";
                        
                        msgDiv.innerHTML = '<span class="user" style="color:' + userColor + ';">' + userName + '</span>' +
                                           '<span class="separator">:</span>' +
                                           '<span class="text">' + cleanMessage + '</span>';
                        
                        chatContainer.appendChild(msgDiv);

                        while (chatContainer.children.length > MAX_MESSAGES) {
                            chatContainer.removeChild(chatContainer.firstChild);
                        }

                        if (nearEnd) {
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        }
                    }
                }
            };
        }

        function parseTwitchEmotes(message, rawEmotes) {
            var emoteList = [];

            var emoteGroups = rawEmotes.split("/");
            for (var i = 0; i < emoteGroups.length; i++) {
                var parts = emoteGroups[i].split(":");
                var emoteId = parts[0];
                if (!parts[1]) continue;

                var positions = parts[1].split(",");
                for (var j = 0; j < positions.length; j++) {
                    var pos = positions[j].split("-");
                    emoteList.push({
                        id: emoteId,
                        start: parseInt(pos[0], 10),
                        end: parseInt(pos[1], 10)
                    });
                }
            }

            emoteList.sort(function(a, b) {
                return b.start - a.start;
            });

            for (var k = 0; k < emoteList.length; k++) {
                var e = emoteList[k];
                var emoteUrl = "https://static-cdn.jtvnw.net/emoticons/v2/" + e.id + "/default/dark/1.0";
                var imgTag = '<img class="chat-emote" src="' + emoteUrl + '" />';
                
                message = message.substring(0, e.start) + imgTag + message.substring(e.end + 1);
            }

            return message;
        }
    </script>
</body>
</html>
