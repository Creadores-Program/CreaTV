plugins {
    id 'com.android.application'
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation files('libs/streamlink-android-8.6.3.aar')
}

android {
    namespace 'org.CreadoresProgram.CreaTv'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 9
        targetSdkVersion 29
        versionCode 3
        versionName "1.2.0-beta"
    }
    signingConfigs {
        debug {
            storeFile file('CreaTv.keystore')
            storePassword System.getenv("CREATVKEYCONTREAPP")
            keyAlias "CreaTVkey"
            keyPassword System.getenv("CREATVKEYCONTREAPP")
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
