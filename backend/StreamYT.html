<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, height=device-heiht initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>YouTube Stream Player</title>
  <style type="text/css">
    body,html{background-color:#000;height:100%;margin:0;overflow:hidden;padding:0;width:100%}#player-wrapper,.controls-overlay{height:100%;left:0;position:absolute;top:0;width:100%}.controls-overlay{background:transparent;z-index:10}.play-pause-btn{background-color:#000;background-color:rgba(0,0,0,.6);border:2px solid #fff;-webkit-border-radius:35px;-moz-border-radius:35px;border-radius:35px;color:#fff;display:-webkit-box;display:-webkit-flex;display:-moz-box;display:-ms-flexbox;display:flex;font-size:6vmin;height:16vmin;left:50%;line-height:1;max-height:120px;max-width:120px;min-height:60px;min-width:60px;position:absolute;top:50%;-webkit-transform:translate(-50%,-50%);-moz-transform:translate(-50%,-50%);-ms-transform:translate(-50%,-50%);-o-transform:translate(-50%,-50%);transform:translate(-50%,-50%);width:16vmin;-webkit-box-pack:center;-webkit-justify-content:center;-moz-box-pack:center;-ms-flex-pack:center;justify-content:center;-webkit-box-align:center;-webkit-align-items:center;-moz-box-align:center;-ms-flex-align:center;align-items:center;cursor:pointer;filter:alpha(opacity=100);opacity:1;outline:none;-webkit-transition:opacity 0.3s ease,-webkit-transform 0.2s ease;transition:opacity 0.3s ease,-webkit-transform 0.2s ease;-o-transition:opacity 0.3s ease,-o-transform 0.2s ease;-moz-transition:opacity 0.3s ease,transform 0.2s ease,-moz-transform 0.2s ease;transition:opacity 0.3s ease,transform 0.2s ease;transition:opacity 0.3s ease,transform 0.2s ease,-webkit-transform 0.2s ease,-moz-transform 0.2s ease,-o-transform 0.2s ease;-webkit-tap-highlight-color:transparent}.play-pause-btn:hover{background-color:rgba(0,0,0,.85);-webkit-transform:translate(-50%,-50%) scale(1.1);-moz-transform:translate(-50%,-50%) scale(1.1);-ms-transform:translate(-50%,-50%) scale(1.1);-o-transform:translate(-50%,-50%) scale(1.1);transform:translate(-50%,-50%) scale(1.1)}.play-pause-btn:active{background-color:hsla(0,0%,100%,.3);-webkit-transform:translate(-50%,-50%) scale(0.95);-moz-transform:translate(-50%,-50%) scale(0.95);-ms-transform:translate(-50%,-50%) scale(0.95);-o-transform:translate(-50%,-50%) scale(0.95);transform:translate(-50%,-50%) scale(0.95)}.controls-overlay.controls-hidden .play-pause-btn{filter:alpha(opacity=0);opacity:0;pointer-events:none;visibility:hidden}
  </style>
</head>
<body>
  <div id="player-wrapper">
    <div id="ytplayer"></div>
    <div class="controls-overlay" id="overlay">
      <button class="play-pause-btn" id="togglePlayBtn" type="button">&#9654;</button>
    </div>
  </div>

  <script type="text/javascript">
    function getQueryParam(param) {
      if ('URLSearchParams' in window) {
        var urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }
      var query = window.location.search.substring(1);
      var vars = query.split("&");
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split("=");
        if (pair[0] == param) {
          return decodeURIComponent(pair[1]);
        }
      }
      return false;
    }

    function addClass(elem, className) {
      if (elem.classList) {
        elem.classList.add(className);
      } else if (!hasClass(elem, className)) {
        elem.className += ' ' + className;
      }
    }

    function removeClass(elem, className) {
      if (elem.classList) {
        elem.classList.remove(className);
      } else {
        var reg = new RegExp('(\\s|^)' + className + '(\\s|$)');
        elem.className = elem.className.replace(reg, ' ');
      }
    }

    function hasClass(elem, className) {
      if (elem.classList) {
        return elem.classList.contains(className);
      }
      return new RegExp('(\\s|^)' + className + '(\\s|$)').test(elem.className);
    }

    var videoIdFromUrl = getQueryParam("v");

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var overlay = document.getElementById("overlay");
    var btn = document.getElementById("togglePlayBtn");
    var hideTimeout = null;
    var checkInterval = null;
    function showControls() {
      removeClass(overlay, "controls-hidden");
      clearTimeout(hideTimeout);

      if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        hideTimeout = setTimeout(function() {
          addClass(overlay, "controls-hidden");
        }, 3000);
      }
    }
    function resetHideTimer() {
      clearTimeout(hideTimeout);
      removeClass(overlay, "controls-hidden");

      if (player && typeof player.getPlayerState === 'function') {
        var state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
          btn.innerHTML = "&#10074;&#10074;";
          hideTimeout = setTimeout(function() {
            addClass(overlay, "controls-hidden");
          }, 2500);
        } else {
          btn.innerHTML = "&#9654;";
        }
      }
    }
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        btn.innerHTML = "&#10074;&#10074;";
        showControls();
      } else {
        btn.innerHTML = "&#9654;";
        clearTimeout(hideTimeout);
        removeClass(overlay, "controls-hidden");
      }
    }
    function onYouTubeIframeAPIReady() {
      if (videoIdFromUrl) {
        player = new YT.Player('ytplayer', {
          width: '100%',
          height: '100%',
          videoId: videoIdFromUrl,
          host: 'https://www.youtube-nocookie.com',
          playerVars: {
            'autoplay': 1,
            'controls': 0,
            'playsinline': 1,
            'rel': 0,
            'showinfo': 0,
            'modestbranding': 1,
            'enablejsapi': 1
          },
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      }
    }
    function togglePlayAction(e) {
      var eventObj = e || window.event;
      if (eventObj) {
        if (eventObj.stopPropagation) {
          eventObj.stopPropagation();
        } else {
          eventObj.cancelBubble = true;
        }
      }
      
      if (!player || typeof player.getPlayerState !== 'function') return;
      var state = player.getPlayerState();
      
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        btn.innerHTML = "&#9654;";
        clearTimeout(hideTimeout);
        removeClass(overlay, "controls-hidden");
      } else {
        player.playVideo();
        btn.innerHTML = "&#10074;&#10074;";
        resetHideTimer();
      }
    }
    overlay.onmousemove = overlay.ontouchstart = btn.onmousemove = btn.ontouchstart = resetHideTimer;
    overlay.onclick = btn.onclick = togglePlayAction;
  </script>
</body>
</html>
