<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>YouTube Stream Player</title>
  <style type="text/css">
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000000;
      overflow: hidden;
    }

    #player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .controls-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
    }
    .play-pause-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      margin-top: -35px;
      margin-left: -35px;
      -webkit-border-radius: 35px;
      border-radius: 35px;
      background-color: #000000;
      background-color: rgba(0, 0, 0, 0.6);
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 24px;
      line-height: 66px;
      text-align: center;
      cursor: pointer;
      outline: none;
      -webkit-transition: opacity 0.3s ease, -webkit-transform 0.2s ease;
      transition: opacity 0.3s ease, transform 0.2s ease;
      filter: alpha(opacity=100);
      opacity: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .play-pause-btn:hover {
      background-color: rgba(0, 0, 0, 0.85);
      -webkit-transform: scale(1.1);
      transform: scale(1.1);
    }

    .play-pause-btn:active {
      background-color: rgba(255, 255, 255, 0.3);
      -webkit-transform: scale(0.95);
      transform: scale(0.95);
    }

    .controls-overlay.playing .play-pause-btn {
      filter: alpha(opacity=0);
      opacity: 0;
      visibility: hidden;
    }

    #player-wrapper:hover .controls-overlay.playing .play-pause-btn {
      filter: alpha(opacity=100);
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>
  <div id="player-wrapper">
    <div id="ytplayer"></div>
    <div class="controls-overlay" id="overlay">
      <button class="play-pause-btn" id="togglePlayBtn" type="button">▶</button>
    </div>
  </div>

  <script type="text/javascript">
    function getQueryParam(param) {
      var query = window.location.search.substring(1);
      var vars = query.split("&");
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split("=");
        if (pair[0] == param) {
          return decodeURIComponent(pair[1]);
        }
      }
      return false;
    }

    function addClass(elem, className) {
      if (elem.classList) {
        elem.classList.add(className);
      } else if (!hasClass(elem, className)) {
        elem.className += ' ' + className;
      }
    }

    function removeClass(elem, className) {
      if (elem.classList) {
        elem.classList.remove(className);
      } else {
        var reg = new RegExp('(\\s|^)' + className + '(\\s|$)');
        elem.className = elem.className.replace(reg, ' ');
      }
    }

    function hasClass(elem, className) {
      if (elem.classList) {
        return elem.classList.contains(className);
      }
      return new RegExp('(\\s|^)' + className + '(\\s|$)').test(elem.className);
    }

    var videoIdFromUrl = getQueryParam("v");

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      if (videoIdFromUrl) {
        player = new YT.Player('ytplayer', {
          width: '100%',
          height: '100%',
          videoId: videoIdFromUrl,
          host: 'https://www.youtube-nocookie.com',
          playerVars: {
            'autoplay': 1,
            'controls': 0,
            'playsinline': 1,
            'rel': 0,
            'modestbranding': 1,
            'origin': 'https://www.youtube-nocookie.com',
            events: {
              'onStateChange': onPlayerStateChange
            }
          }
        });
      }
    }
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        btn.innerHTML = "&#10074;&#10074;";
        addClass(overlay, "playing");
      } else {
        btn.innerHTML = "&#9654;";
        removeClass(overlay, "playing");
      }
    }
    document.getElementById("togglePlayBtn").onclick = function(){
      if (!player || typeof player.getPlayerState !== 'function') return;
      var state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    };
  </script>
</body>
</html>
